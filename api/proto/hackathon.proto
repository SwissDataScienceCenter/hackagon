
syntax = "proto3";

package hackathon;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/proto";

service Hackathon {
  rpc Create(CreateHackathonRequest) returns (CreateHackathonResponse);
  rpc AddUser(AddUserRequest) returns (AddUserResponse);
  rpc RemoveUser(RemoveUserRequest) returns (google.protobuf.Empty);

  rpc AddPage(AddPageRequest) returns (AddPageResponse);
  rpc DeletePage(DeletePageRequest) returns (google.protobuf.Empty);
}

message CreateHackathonRequest {
    string name = 1;
    optional google.protobuf.Timestamp start_date = 2;
    optional google.protobuf.Timestamp end_date = 3;
    Visibility visibility = 4;
    optional string description = 5;
    optional string logo = 6;
    
}

message CreateHackathonResponse {
    repeated Hackathon hackathon = 1;
}

message AddUserRequest {
    string hackathon_id = 1;
    string user_id = 2;
    HackathonRole role = 3;
}

message AddUserResponse {
    string hackathon_id = 1;
    Member member = 2;
}

message RemoveUserRequest {
    string hackathon_id = 1;
    string user_id = 2;
}


enum HackathonRole {
    Owner = 1;
    Member = 2;
}

enum Visibility {
    Public = 1;
    Private = 2;
}

message Hackathon {
    string id = 1;
    string name = 2;
    optional google.protobuf.Timestamp start_date = 3;
    optional google.protobuf.Timestamp end_date = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp modified_at = 6;
    Visibility visibility = 7;
    optional string description = 8;
    optional string logo = 9;
    repeated HackathonMember members = 10;
}

message Member {
    string id = 1;
    string name = 2;
    HackathonRole role = 3;
}

message AddPageRequest {
    string title = 1;
    string content = 2;
    bool visible = 3;
    int32 order = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp modified_at = 6;
}

message AddPageResponse {
    string page_id = 1;
}

message DeletePageRequest {
    string page_id = 1;
}
