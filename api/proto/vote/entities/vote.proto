syntax = "proto3";

package vote.entities;

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/vote/entities";

// Vote is a single atomic judgment from one voter on one submission
// within one category. The vote payload is method-specific.
message Vote {
  string id = 1;
  string category_id = 2;
  string voter_id = 3;
  oneof vote {
    SingleChoiceVote single_choice = 4;
    RankedVote ranked = 5;
    PointsVote points = 6;
  }
  int64 created_at = 7;
  int64 modified_at = 8;
}

// Each variant describes ONE stored row, because a Vote row is one judgment on
// one submission (see the schema comment). A ranked or points ballot is
// therefore several Vote entities, one per submission, all sharing a category
// and a voter — SubmitVoteResponse.votes hands the whole set back.
message SingleChoiceVote {
  string submission_id = 1;
}

message RankedVote {
  string submission_id = 1;
  // 1 is the voter's first preference.
  int32 rank = 2;
}

message PointsVote {
  string submission_id = 1;
  int32 points = 2;
}
