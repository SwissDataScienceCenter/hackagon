syntax = "proto3";

package vote.entities;

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/vote/entities";

// VoteResult is a placement entry within a vote category.
message VoteResult {
  string id = 1;
  string category_id = 2;
  string submission_id = 3;
  int32 position = 4;
  optional string title = 5;
  int64 created_at = 6;
  int64 modified_at = 7;
}