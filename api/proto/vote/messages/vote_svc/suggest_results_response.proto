syntax = "proto3";

package vote.messages.vote_svc;

import "vote/entities/vote_result.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/vote/messages/vote_svc";

message SuggestResultsResponse {
  // The rows as written, ordered by position. Ties share a position — two
  // submissions on the same count are both second, and the organizer decides
  // what to do about it rather than the tally inventing an order.
  repeated vote.entities.VoteResult results = 1;
}
