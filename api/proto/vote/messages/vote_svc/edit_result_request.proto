syntax = "proto3";

package vote.messages.vote_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/vote/messages/vote_svc";

message EditVoteResultRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string submission_id = 2 [(buf.validate.field).string.uuid = true];
  optional int32 position = 3;
  optional string title = 4 [(buf.validate.field).string.max_len = 255];
}