syntax = "proto3";

package vote.messages.vote_svc;

import "buf/validate/validate.proto";
import "vote/entities/voter_type.proto";
import "vote/entities/voting_method.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/vote/messages/vote_svc";

message CreateVoteCategoryRequest {
  string hackathon_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 255
  ];
  string description = 3 [(buf.validate.field).string.max_len = 10000];
  vote.entities.VotingMethod voting_method = 4 [(buf.validate.field).enum.defined_only = true];
  vote.entities.VoterType voter_type = 5 [(buf.validate.field).enum.defined_only = true];
  optional int32 max_points = 6 [(buf.validate.field).int32.gte = 1];
  repeated string jury_member_ids = 7 [(buf.validate.field).repeated.items.string.uuid = true];
}
