syntax = "proto3";

package vote;

import "vote/messages/vote_svc/create_category_request.proto";
import "vote/messages/vote_svc/create_category_response.proto";
import "vote/messages/vote_svc/create_result_request.proto";
import "vote/messages/vote_svc/create_result_response.proto";
import "vote/messages/vote_svc/delete_category_request.proto";
import "vote/messages/vote_svc/delete_category_response.proto";
import "vote/messages/vote_svc/delete_result_request.proto";
import "vote/messages/vote_svc/delete_result_response.proto";
import "vote/messages/vote_svc/edit_category_request.proto";
import "vote/messages/vote_svc/edit_category_response.proto";
import "vote/messages/vote_svc/edit_result_request.proto";
import "vote/messages/vote_svc/edit_result_response.proto";
import "vote/messages/vote_svc/export_results_request.proto";
import "vote/messages/vote_svc/export_results_response.proto";
import "vote/messages/vote_svc/export_votes_request.proto";
import "vote/messages/vote_svc/export_votes_response.proto";
import "vote/messages/vote_svc/get_category_request.proto";
import "vote/messages/vote_svc/get_category_response.proto";
import "vote/messages/vote_svc/get_vote_request.proto";
import "vote/messages/vote_svc/get_vote_response.proto";
import "vote/messages/vote_svc/list_categories_request.proto";
import "vote/messages/vote_svc/list_categories_response.proto";
import "vote/messages/vote_svc/list_results_request.proto";
import "vote/messages/vote_svc/list_results_response.proto";
import "vote/messages/vote_svc/list_votes_request.proto";
import "vote/messages/vote_svc/list_votes_response.proto";
import "vote/messages/vote_svc/submit_vote_request.proto";
import "vote/messages/vote_svc/submit_vote_response.proto";
import "vote/messages/vote_svc/suggest_results_request.proto";
import "vote/messages/vote_svc/suggest_results_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/vote";

service VoteService {
  // VoteCategory CRUD
  rpc ListVoteCategories(vote.messages.vote_svc.ListVoteCategoriesRequest) returns (vote.messages.vote_svc.ListVoteCategoriesResponse);
  rpc GetVoteCategory(vote.messages.vote_svc.GetVoteCategoryRequest) returns (vote.messages.vote_svc.GetVoteCategoryResponse);
  rpc CreateVoteCategory(vote.messages.vote_svc.CreateVoteCategoryRequest) returns (vote.messages.vote_svc.CreateVoteCategoryResponse);
  rpc EditVoteCategory(vote.messages.vote_svc.EditVoteCategoryRequest) returns (vote.messages.vote_svc.EditVoteCategoryResponse);
  rpc DeleteVoteCategory(vote.messages.vote_svc.DeleteVoteCategoryRequest) returns (vote.messages.vote_svc.DeleteVoteCategoryResponse);

  // Voting
  rpc SubmitVote(vote.messages.vote_svc.SubmitVoteRequest) returns (vote.messages.vote_svc.SubmitVoteResponse);
  rpc GetVote(vote.messages.vote_svc.GetVoteRequest) returns (vote.messages.vote_svc.GetVoteResponse);
  rpc ListVotes(vote.messages.vote_svc.ListVotesRequest) returns (vote.messages.vote_svc.ListVotesResponse);
  rpc ExportVotes(vote.messages.vote_svc.ExportVotesRequest) returns (vote.messages.vote_svc.ExportVotesResponse);

  // Vote Results
  rpc ListVoteResults(vote.messages.vote_svc.ListVoteResultsRequest) returns (vote.messages.vote_svc.ListVoteResultsResponse);
  rpc CreateVoteResult(vote.messages.vote_svc.CreateVoteResultRequest) returns (vote.messages.vote_svc.CreateVoteResultResponse);
  rpc EditVoteResult(vote.messages.vote_svc.EditVoteResultRequest) returns (vote.messages.vote_svc.EditVoteResultResponse);
  rpc DeleteVoteResult(vote.messages.vote_svc.DeleteVoteResultRequest) returns (vote.messages.vote_svc.DeleteVoteResultResponse);
  // Computes the tally and writes it as results for the organizer to review.
  // Advisory by design — see SuggestResultsRequest, and PrizeService for what
  // actually freezes an award.
  rpc SuggestResults(vote.messages.vote_svc.SuggestResultsRequest) returns (vote.messages.vote_svc.SuggestResultsResponse);
  rpc ExportResults(vote.messages.vote_svc.ExportResultsRequest) returns (vote.messages.vote_svc.ExportResultsResponse);
}
