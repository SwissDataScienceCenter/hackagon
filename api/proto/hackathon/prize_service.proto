syntax = "proto3";

package hackathon;

import "hackathon/messages/prize_svc/edit_request.proto";
import "hackathon/messages/prize_svc/edit_response.proto";
import "hackathon/messages/prize_svc/finalize_request.proto";
import "hackathon/messages/prize_svc/finalize_response.proto";
import "hackathon/messages/prize_svc/set_request.proto";
import "hackathon/messages/prize_svc/set_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

// The prize table and the awards. Votes are advisory: nothing is won until
// the admin finalizes, and the table stays admin-editable afterwards.
service PrizeService {
  rpc Set(hackathon.messages.prize_svc.SetRequest) returns (hackathon.messages.prize_svc.SetResponse);
  rpc Finalize(hackathon.messages.prize_svc.FinalizeRequest) returns (hackathon.messages.prize_svc.FinalizeResponse);
  rpc Edit(hackathon.messages.prize_svc.EditRequest) returns (hackathon.messages.prize_svc.EditResponse);
}
