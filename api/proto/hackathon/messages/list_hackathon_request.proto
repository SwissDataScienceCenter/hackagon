syntax = "proto3";

package hackathon;

import "hackathon/entities/hackathon_status.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto";

message ListHackathonRequest {
    repeated HackathonStatus status_filter = 1;
    optional string owner_id = 2;
    optional string participant_id = 3;
}

