syntax = "proto3";

package hackathon.messages;

import "hackathon/entities/hackathon_status.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages";

message ListHackathonRequest {
  repeated hackathon.entities.HackathonStatus status_filter = 1;
  optional string owner_id = 2;
  optional string participant_id = 3;
}
