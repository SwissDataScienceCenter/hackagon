syntax = "proto3";

package hackathon.messages.prize_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/prize_svc";

message EditRequest {
  string hackathon_id = 1 [(buf.validate.field).string.uuid = true];
  int32 rank = 2;
  optional string title = 3 [(buf.validate.field).string.max_len = 500];
}
