syntax = "proto3";

package hackathon.messages.page_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/page_svc";

message EditRequest {
  string page_id = 1 [(buf.validate.field).string.uuid = true];
  optional string title = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 255
  ];
  optional string content = 3 [(buf.validate.field).string.max_len = 10000];
  optional bool visible = 4;
  // order should not be modified here - use MoveUp/MoveDown/SetOrder instead
}
