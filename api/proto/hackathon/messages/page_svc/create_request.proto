syntax = "proto3";

package hackathon.messages.page_svc;

import "buf/validate/validate.proto";
import "google/protobuf/wrappers.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/page_svc";

message CreateRequest {
  string hackathon_id = 1 [(buf.validate.field).string.uuid = true];
  string title = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 255
  ];
  string content = 3 [(buf.validate.field).string.max_len = 10000];
  bool visible = 4;
  // order is automatically assigned by backend (max(order) + 1)
}
