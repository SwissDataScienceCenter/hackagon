syntax = "proto3";

package hackathon.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages";

message AddProjectResponse {
    string project_id = 1;
    string title = 2;
    string status = 3;
    google.protobuf.Timestamp created_at = 4;
}
