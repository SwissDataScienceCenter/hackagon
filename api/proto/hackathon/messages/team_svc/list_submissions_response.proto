syntax = "proto3";

package hackathon.messages.team_svc;

import "hackathon/entities/submission.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/team_svc";

message ListSubmissionsResponse {
  // Ordered by team_id ascending, then by version ascending (oldest first).
  // (team_id, version) is unique, so the order is total.
  repeated hackathon.entities.Submission submissions = 1;
}
