syntax = "proto3";

package hackathon.messages.team_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/team_svc";

message CreateSubmissionRequest {
  string team_id = 1;
  string project_id = 2;
  // URL of the repository holding the submission's output.
  // The backend checks that this is an absolute https URL.
  // TODO: rename to `repository_url` after the hackathon.
  optional string result = 3 [(buf.validate.field).string.max_len = 2048];
  // Must be an absolute https URL; checked by the handler.
  optional string attachment_folder_url = 4 [(buf.validate.field).string.max_len = 2048];
  optional string description = 5 [(buf.validate.field).string.max_len = 10000];
}
