syntax = "proto3";

package hackathon.messages.team_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/team_svc";

message EditSubmissionRequest {
  string submission_id = 1 [(buf.validate.field).string.uuid = true];
  optional string result = 2 [(buf.validate.field).string.max_len = 50000];
  // Structured answers, same keys and validation as CreateSubmission. Without
  // this the form was frozen at create time: a team that mistyped a repo URL
  // could edit the free text around it but never the field the organizer
  // actually asked for. Absent (not merely empty) leaves the stored answers
  // untouched, so an edit of `result` alone cannot wipe them.
  map<string, string> form = 3;
}
