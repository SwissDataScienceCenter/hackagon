syntax = "proto3";

package hackathon.messages.team_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/team_svc";

message ListSubmissionsRequest {
  oneof value {
    string team_id = 1 [(buf.validate.field).string.uuid = true];
    string hackathon_id = 2 [(buf.validate.field).string.uuid = true];
  }
}
