syntax = "proto3";

package hackathon;

import "google/protobuf/timestamp.proto";
import "hackathon/entities/visibility.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages";

message CreateHackathonRequest {
  string name = 1;
  optional google.protobuf.Timestamp start_date = 2;
  optional google.protobuf.Timestamp end_date = 3;
  Visibility visibility = 4;
  optional string description = 5;
  optional string logo = 6;
}
