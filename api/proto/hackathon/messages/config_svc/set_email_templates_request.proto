syntax = "proto3";

package hackathon.messages.config_svc;

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/config_svc";

import "buf/validate/validate.proto";

// Notification COPY, stored per hackathon. Sending is a separate concern (no
// notification service exists yet) — this pins the text organizers author so
// it survives that gap.
message SetEmailTemplatesRequest {
  string hackathon_id = 1 [(buf.validate.field).string.uuid = true];
  // Keyed by moment: registrationConfirmed, teamAssigned, deadlineReminder,
  // results. Unknown keys are rejected so a typo is not silently stored.
  map<string, string> templates = 2;
}
