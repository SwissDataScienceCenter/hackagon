syntax = "proto3";

package hackathon.messages.phase_svc;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/phase_svc";

message CreateRequest {
  string hackathon_id = 1;
  string name = 2;
  string description = 3;
  optional google.protobuf.Timestamp start_date = 4;
  optional google.protobuf.Timestamp end_date = 5;
}
