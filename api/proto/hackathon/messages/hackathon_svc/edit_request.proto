syntax = "proto3";

package hackathon.messages.hackathon_svc;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hackathon/entities/visibility.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/hackathon_svc";

message EditRequest {
  string hackathon_id = 1 [(buf.validate.field).string.uuid = true];
  optional string name = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_len = 255
  ];
  optional string description = 3 [(buf.validate.field).string.max_len = 10000];
  optional hackathon.entities.Visibility visibility = 4;
  optional google.protobuf.Timestamp starts_at = 5;
  optional google.protobuf.Timestamp ends_at = 6;
  optional string logo = 7 [(buf.validate.field).string.max_len = 5000];

  option (buf.validate.message).cel = {
    id: "starts_at_requires_ends_at"
    message: "ends_at must be present if starts_at is present and must be after starts_at"
    expression: "(!has(this.starts_at) && !has(this.ends_at)) || (has(this.starts_at) && has(this.ends_at) && this.ends_at >= this.starts_at)"
  };
}
