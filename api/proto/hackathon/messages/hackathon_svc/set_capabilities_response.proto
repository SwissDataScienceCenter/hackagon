syntax = "proto3";

package hackathon.messages.hackathon_svc;

import "hackathon/entities/capability.proto";
import "hackathon/entities/hackathon_state.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/hackathon_svc";

// Returns the resulting capabilities in the same shape `Get` reports them, so a
// caller re-renders from the response instead of refetching the hackathon.
//
// `CapabilityStatus`, not the booleans that went in: what the server enforces
// is the four-state answer, including a schedule derived from the linked
// phases, and a toggle is only one input to it. Echoing the request back would
// hide the case where a capability is governed by a phase window and the
// organiser's switch did not decide it.
message SetCapabilitiesResponse {
  repeated hackathon.entities.CapabilityStatus capabilities = 1;
  // The same answer flattened into main's `HackathonState`, for clients written
  // against that contract. Field 2, not 1: main puts `state` on tag 1 and ours
  // is already taken by `capabilities`, and renumbering a shipped field to gain
  // decode compatibility would break the callers we actually have. A main
  // client reads `state` from `Get` instead, where the tag was free.
  hackathon.entities.HackathonState state = 2;
}
