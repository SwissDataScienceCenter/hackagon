syntax = "proto3";

package hackathon.messages.hackathon_svc;

import "hackathon/entities/hackathon_state.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/hackathon_svc";

// Main's shape verbatim, tag included — this message is new here, so nothing
// had to move to make room for it. Native callers should prefer `AdvancePhase`,
// whose response carries the full `CapabilityStatus` list this one flattens.
message SetCurrentPhaseResponse {
  hackathon.entities.HackathonState state = 1;
}
