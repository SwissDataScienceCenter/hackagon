syntax = "proto3";

package hackathon.messages.hackathon_svc;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hackathon/entities/visibility.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/hackathon_svc";

message CreateRequest {
  string name = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 255
  ];
  optional google.protobuf.Timestamp starts_at = 2;
  optional google.protobuf.Timestamp ends_at = 3;

  option (buf.validate.message).cel = {
    id: "starts_at_requires_ends_at"
    message: "ends_at must be present if starts_at is present and must be after starts_at"
    expression: "(!has(this.starts_at) && !has(this.ends_at)) || (has(this.starts_at) && has(this.ends_at) && this.ends_at >= this.starts_at)"
  };

  hackathon.entities.Visibility visibility = 4 [(buf.validate.field).enum.defined_only = true];
  optional string description = 5 [(buf.validate.field).string.max_len = 10000];
  // A `uri = true` rule here rejected BOTH values this platform actually
  // produces: the empty string (an event with no cover yet, which is every
  // event at Create time) and the root-relative `/objects/...` path that
  // StorageService returns and cmd/seed writes. Only a full absolute URL
  // passed — the one shape we do not generate. Edit.logo never had the rule,
  // so the same value was accepted or refused depending on which RPC you used.
  optional string logo = 6 [
    (buf.validate.field).string.max_len = 5000,
    (buf.validate.field).cel = {
      id: "logo.path_or_url"
      message: "logo must be empty, a root-relative /objects path, an http(s) URL, or an inline data:image URI"
      expression: "this == '' || this.startsWith('/') || this.startsWith('http://') || this.startsWith('https://') || this.startsWith('data:image/')"
    }
  ];
}
