syntax = "proto3";

package hackathon.messages.hackathon_svc;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hackathon/entities/visibility.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/hackathon_svc";

message CreateRequest {
  string name = 1 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.max_len = 255
  ];
  optional google.protobuf.Timestamp starts_at = 2;
  optional google.protobuf.Timestamp ends_at = 3;

  option (buf.validate.message).cel = {
    id: "starts_at_requires_ends_at"
    message: "ends_at must be present if starts_at is present and must be after starts_at"
    expression: "(!has(this.starts_at) && !has(this.ends_at)) || (has(this.starts_at) && has(this.ends_at) && this.ends_at >= this.starts_at)"
  };

  hackathon.entities.Visibility visibility = 4 [(buf.validate.field).enum.defined_only = true];
  optional string description = 5 [(buf.validate.field).string.max_len = 2048];
  optional string logo = 6 [(buf.validate.field).string.uri = true];
}
