syntax = "proto3";

package hackathon.messages.hackathon_svc;

import "hackathon/entities/hackathon_status.proto";
import "hackathon/entities/visibility.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages/hackathon_svc";

message ListRequest {
  repeated hackathon.entities.HackathonStatus status_filter = 1;
  optional string owner_id = 2;
  optional string participant_id = 3;
  optional hackathon.entities.Visibility visibility_filter = 4;
}
