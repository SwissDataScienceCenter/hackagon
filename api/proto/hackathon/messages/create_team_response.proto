syntax = "proto3";

package hackathon.messages;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/messages";

message CreateTeamResponse {
    string team_id = 1;
    string name = 2;
    google.protobuf.Timestamp created_at = 3;
}
