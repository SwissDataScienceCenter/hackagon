syntax = "proto3";

package hackathon;

import "hackathon/entities/hackathon_role.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto";

message AddUserRequest {
    string hackathon_id = 1;
    string user_id = 2;
    HackathonRole role = 3;
}
