syntax = "proto3";

package hackathon.entities;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

message Phase {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional google.protobuf.Timestamp starts_at = 4;
  optional google.protobuf.Timestamp ends_at = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp modified_at = 7;
  string hackathon_id = 8;
  optional string page_id = 9;
  string creator_id = 10;
  string modifier_id = 11;
}
