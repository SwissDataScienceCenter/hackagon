syntax = "proto3";

package hackathon.entities;

import "hackathon/entities/public_submission.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

// A team as the public sees it: a member_count rather than members.
// See PublicHackathon for why this entity exists.
message PublicTeam {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string project_id = 4;
  int32 member_count = 5;
  // Final submissions only; see PublicSubmission.
  repeated PublicSubmission submissions = 6;
}
