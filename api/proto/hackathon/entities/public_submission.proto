syntax = "proto3";

package hackathon.entities;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

// A final submission as the public sees it. Only approved projects and no comments.
// See PublicHackathon for why this entity exists.
message PublicSubmission {
  string id = 1;
  optional string result = 2;
  google.protobuf.Timestamp created_at = 3;
}
