syntax = "proto3";

package hackathon.entities;

import "google/protobuf/timestamp.proto";
import "hackathon/entities/capability.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

message HackathonState {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  google.protobuf.Timestamp modified_at = 3;
  string current_phase_id = 4;
  repeated CapabilityState capabilities = 5;
}

message CapabilityState {
  Capability capability = 1;
  bool enabled = 2;
}
