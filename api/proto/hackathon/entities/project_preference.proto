syntax = "proto3";

package hackathon.entities;

import "google/protobuf/timestamp.proto";
import "hackathon/entities/project_status.proto";
import "user/entities/user.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

message ProjectWithPreferences {
  string id = 1;
  string title = 2;
  string description = 3;
  ProjectStatus status = 4;
  optional string image = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp modified_at = 7;
  string track_id = 8;
  string hackathon_id = 9;
  // List of users who have this project as their preference
  repeated user.entities.User preferences = 10;
}
