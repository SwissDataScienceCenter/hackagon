syntax = "proto3";

package hackathon.entities;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hackathon/entities/capability.proto";
import "hackathon/entities/form_schema.proto";
import "hackathon/entities/hackathon_branding.proto";
import "hackathon/entities/hackathon_member.proto";
import "hackathon/entities/hackathon_settings.proto";
import "hackathon/entities/hackathon_state.proto";
import "hackathon/entities/hackathon_status.proto";
import "hackathon/entities/hackathon_voting_policy.proto";
import "hackathon/entities/page.proto";
import "hackathon/entities/phase.proto";
import "hackathon/entities/project.proto";
import "hackathon/entities/track.proto";
import "hackathon/entities/visibility.proto";
import "user/entities/user.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

message Hackathon {
  string id = 1;
  string name = 2;
  optional google.protobuf.Timestamp starts_at = 3;
  optional google.protobuf.Timestamp ends_at = 4;

  option (buf.validate.message).cel = {
    id: "starts_at_requires_ends_at"
    message: "ends_at must be present if starts_at is present and must be after starts_at"
    expression: "(!has(this.starts_at) && !has(this.ends_at)) || (has(this.starts_at) && has(this.ends_at) && this.ends_at >= this.starts_at)"
  };

  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp modified_at = 6;
  Visibility visibility = 7;
  // Computed server-side from starts_at/ends_at; not persisted in DB.
  HackathonStatus status = 8;
  optional string description = 9;
  optional string logo = 10;
  repeated HackathonMember members = 11;
  user.entities.User creator = 12;
  user.entities.User modifier = 13;
  // The following collections are populated only on Get responses.
  repeated Track tracks = 14;
  repeated Project projects = 15;
  repeated Page pages = 16;
  repeated Phase phases = 17;
  // Populated in List responses only when participant_id filter is set.
  // Contains the requesting user's membership in this hackathon (role + is_waiting).
  optional HackathonMember viewer_membership = 18;
  // Populated in Get responses only.
  HackathonSettings settings = 19;
  // Computed server-side from the stored capability rows; not persisted as a
  // whole. Populated on both Get and List, so a list can gate its own buttons
  // rather than firing a mutation to discover something is closed.
  //
  // Will become caller-dependent, so clients must not cache it across users.
  repeated CapabilityStatus capabilities = 20;
  // The phase an organizer declared current via AdvancePhase. Absent means
  // clients should derive it from phase dates instead — correct before an event,
  // wrong during one, where the schedule slips.
  optional string current_phase_id = 21;
  // Set by ConfigService.SetBranding. Populated on Get and on List — the
  // public event page is built from List, so leaving it Get-only would make an
  // event's own colours invisible exactly where visitors see it. Absent when
  // the organizer set no branding.
  optional HackathonBranding branding = 22;
  // Organizer-defined form schemas (ConfigService.SetRegistrationForm /
  // SetSubmissionForm). Populated on Get only — a client needs them to RENDER
  // the form it is about to submit, and without a read path the only way to
  // fill one in was to guess the field keys. Absent when no form is defined,
  // which means "accept anything" on the write side.
  optional FormSchema registration_form = 23;
  optional FormSchema submission_form = 24;
  // Organizer-authored notification copy (ConfigService.SetEmailTemplates),
  // keyed "<moment>" for the body and "<moment>Subject" for the subject line.
  // Get only, and readable by members: it is copy about the event, not a
  // secret — but nothing sends it, so organizers compose from it by hand.
  map<string, string> email_templates = 25;
  // How the vote works (ConfigService.SetVotingPolicy). Readable by anyone who
  // can read the hackathon, because these are the rules the voters are bound
  // by: "may I vote for my own team" is a voter's question. Absent when the
  // organizer set no policy, which means the backend's defaults.
  optional HackathonVotingPolicy voting_policy = 26;
  // A FAÇADE over `capabilities` above, in main's flat boolean shape — see
  // `hackathon_state.proto`. Nothing is stored for it and nothing enforces from
  // it; it is `capabilities` projected through
  // `state == OPEN || state == UNGOVERNED`, plus `current_phase_id`.
  //
  // Populated wherever `capabilities` is, which is Get AND List: a facade that
  // appeared on only one of them would be a worse contract than no facade.
  //
  // Tag 27 because main's 19 is our `settings` and 1-26 are all in use here.
  // A main client therefore finds `state` at a different number than it expects
  // — the shape is compatible, the address on this message is not, and
  // renumbering shipped fields to fix that would break every caller we have.
  HackathonState state = 27;
  // Maximum number of CONFIRMED participants; people on the waiting list do
  // not consume a place. Absent or 0 means unlimited. When set, Join hands out
  // free places first-come-first-served while nobody is waiting, and a full
  // event queues new registrants instead of refusing them. Organizers may
  // approve past this number — it is their estimate of the room, not a law.
  optional int32 max_participants = 28;
}
