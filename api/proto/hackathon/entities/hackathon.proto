syntax = "proto3";

package hackathon.entities;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "hackathon/entities/capability.proto";
import "hackathon/entities/hackathon_member.proto";
import "hackathon/entities/hackathon_settings.proto";
import "hackathon/entities/hackathon_status.proto";
import "hackathon/entities/page.proto";
import "hackathon/entities/phase.proto";
import "hackathon/entities/project.proto";
import "hackathon/entities/track.proto";
import "hackathon/entities/visibility.proto";
import "user/entities/user.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

message Hackathon {
  string id = 1;
  string name = 2;
  optional google.protobuf.Timestamp starts_at = 3;
  optional google.protobuf.Timestamp ends_at = 4;

  option (buf.validate.message).cel = {
    id: "starts_at_requires_ends_at"
    message: "ends_at must be present if starts_at is present and must be after starts_at"
    expression: "(!has(this.starts_at) && !has(this.ends_at)) || (has(this.starts_at) && has(this.ends_at) && this.ends_at >= this.starts_at)"
  };

  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp modified_at = 6;
  Visibility visibility = 7;
  // Computed server-side from starts_at/ends_at; not persisted in DB.
  HackathonStatus status = 8;
  optional string description = 9;
  optional string logo = 10;
  repeated HackathonMember members = 11;
  user.entities.User creator = 12;
  user.entities.User modifier = 13;
  // The following collections are populated only on Get responses.
  repeated Track tracks = 14;
  repeated Project projects = 15;
  repeated Page pages = 16;
  repeated Phase phases = 17;
  // Populated in List responses only when participant_id filter is set.
  // Contains the requesting user's membership in this hackathon (role + is_waiting).
  optional HackathonMember viewer_membership = 18;
  // Populated in Get responses only.
  HackathonSettings settings = 19;
  // Computed server-side from the stored capability rows; not persisted as a
  // whole. Populated on both Get and List, so a list can gate its own buttons
  // rather than firing a mutation to discover something is closed.
  //
  // Will become caller-dependent, so clients must not cache it across users.
  repeated CapabilityStatus capabilities = 20;
  // The phase an organizer declared current via AdvancePhase. Absent means
  // clients should derive it from phase dates instead — correct before an event,
  // wrong during one, where the schedule slips.
  optional string current_phase_id = 21;
}
