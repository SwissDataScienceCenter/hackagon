syntax = "proto3";

package hackathon.entities;

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon/entities";

// A project as the public sees it. Only approved projects and no comments.
// See PublicHackathon for why this entity exists.
message PublicProject {
  string id = 1;
  string title = 2;
  string description = 3;
  optional string image = 4;
  string track_id = 5;
}
