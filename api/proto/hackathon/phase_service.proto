syntax = "proto3";

package hackathon;

import "hackathon/messages/phase_svc/create_request.proto";
import "hackathon/messages/phase_svc/create_response.proto";
import "hackathon/messages/phase_svc/delete_request.proto";
import "hackathon/messages/phase_svc/delete_response.proto";
import "hackathon/messages/phase_svc/edit_request.proto";
import "hackathon/messages/phase_svc/edit_response.proto";
import "hackathon/messages/phase_svc/get_request.proto";
import "hackathon/messages/phase_svc/get_response.proto";
import "hackathon/messages/phase_svc/list_request.proto";
import "hackathon/messages/phase_svc/list_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

service PhaseService {
  rpc List(hackathon.messages.phase_svc.ListRequest) returns (hackathon.messages.phase_svc.ListResponse);
  rpc Get(hackathon.messages.phase_svc.GetRequest) returns (hackathon.messages.phase_svc.GetResponse);
  rpc Create(hackathon.messages.phase_svc.CreateRequest) returns (hackathon.messages.phase_svc.CreateResponse);
  rpc Edit(hackathon.messages.phase_svc.EditRequest) returns (hackathon.messages.phase_svc.EditResponse);
  rpc Delete(hackathon.messages.phase_svc.DeleteRequest) returns (hackathon.messages.phase_svc.DeleteResponse);
}
