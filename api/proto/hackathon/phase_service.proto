
syntax = "proto3";

package hackathon;

import "hackathon/messages/add_phase_request.proto";
import "hackathon/messages/add_phase_response.proto";
import "hackathon/messages/edit_phase_request.proto";
import "hackathon/messages/edit_phase_response.proto";
import "hackathon/messages/delete_phase_request.proto";
import "hackathon/messages/delete_phase_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

service PhaseService {
  rpc Add(hackathon.messages.AddPhaseRequest) returns (hackathon.messages.AddPhaseResponse);
  rpc Edit(hackathon.messages.EditPhaseRequest) returns (hackathon.messages.EditPhaseResponse);
  rpc Delete(hackathon.messages.DeletePhaseRequest) returns (hackathon.messages.DeletePhaseResponse);
}

