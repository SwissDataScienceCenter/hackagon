syntax = "proto3";

package hackathon;

import "hackathon/messages/hackathon_svc/add_owner_request.proto";
import "hackathon/messages/hackathon_svc/add_owner_response.proto";
import "hackathon/messages/hackathon_svc/advance_phase_request.proto";
import "hackathon/messages/hackathon_svc/advance_phase_response.proto";
import "hackathon/messages/hackathon_svc/approve_participant_request.proto";
import "hackathon/messages/hackathon_svc/approve_participant_response.proto";
import "hackathon/messages/hackathon_svc/create_request.proto";
import "hackathon/messages/hackathon_svc/create_response.proto";
import "hackathon/messages/hackathon_svc/delete_request.proto";
import "hackathon/messages/hackathon_svc/delete_response.proto";
import "hackathon/messages/hackathon_svc/edit_capability_request.proto";
import "hackathon/messages/hackathon_svc/edit_capability_response.proto";
import "hackathon/messages/hackathon_svc/edit_request.proto";
import "hackathon/messages/hackathon_svc/edit_response.proto";
import "hackathon/messages/hackathon_svc/edit_settings_request.proto";
import "hackathon/messages/hackathon_svc/edit_settings_response.proto";
import "hackathon/messages/hackathon_svc/get_request.proto";
import "hackathon/messages/hackathon_svc/get_response.proto";
import "hackathon/messages/hackathon_svc/join_request.proto";
import "hackathon/messages/hackathon_svc/join_response.proto";
import "hackathon/messages/hackathon_svc/list_request.proto";
import "hackathon/messages/hackathon_svc/list_response.proto";
import "hackathon/messages/hackathon_svc/remove_owner_request.proto";
import "hackathon/messages/hackathon_svc/remove_owner_response.proto";
import "hackathon/messages/hackathon_svc/remove_participant_request.proto";
import "hackathon/messages/hackathon_svc/submit_registration_form_request.proto";
import "hackathon/messages/hackathon_svc/submit_registration_form_response.proto";
import "hackathon/messages/hackathon_svc/remove_participant_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

service HackathonService {
  rpc List(hackathon.messages.hackathon_svc.ListRequest) returns (hackathon.messages.hackathon_svc.ListResponse);
  rpc Get(hackathon.messages.hackathon_svc.GetRequest) returns (hackathon.messages.hackathon_svc.GetResponse);
  rpc Create(hackathon.messages.hackathon_svc.CreateRequest) returns (hackathon.messages.hackathon_svc.CreateResponse);
  rpc Edit(hackathon.messages.hackathon_svc.EditRequest) returns (hackathon.messages.hackathon_svc.EditResponse);
  rpc Delete(hackathon.messages.hackathon_svc.DeleteRequest) returns (hackathon.messages.hackathon_svc.DeleteResponse);
  rpc EditCapability(hackathon.messages.hackathon_svc.EditCapabilityRequest) returns (hackathon.messages.hackathon_svc.EditCapabilityResponse);
  rpc AdvancePhase(hackathon.messages.hackathon_svc.AdvancePhaseRequest) returns (hackathon.messages.hackathon_svc.AdvancePhaseResponse);
  rpc EditSettings(hackathon.messages.hackathon_svc.EditSettingsRequest) returns (hackathon.messages.hackathon_svc.EditSettingsResponse);
  rpc Join(hackathon.messages.hackathon_svc.JoinRequest) returns (hackathon.messages.hackathon_svc.JoinResponse);
  rpc ApproveParticipant(hackathon.messages.hackathon_svc.ApproveParticipantRequest) returns (hackathon.messages.hackathon_svc.ApproveParticipantResponse);
  rpc RemoveParticipant(hackathon.messages.hackathon_svc.RemoveParticipantRequest) returns (hackathon.messages.hackathon_svc.RemoveParticipantResponse);
  rpc SubmitRegistrationForm(hackathon.messages.hackathon_svc.SubmitRegistrationFormRequest) returns (hackathon.messages.hackathon_svc.SubmitRegistrationFormResponse);
  rpc AddOwner(hackathon.messages.hackathon_svc.AddOwnerRequest) returns (hackathon.messages.hackathon_svc.AddOwnerResponse);
  rpc RemoveOwner(hackathon.messages.hackathon_svc.RemoveOwnerRequest) returns (hackathon.messages.hackathon_svc.RemoveOwnerResponse);
}
