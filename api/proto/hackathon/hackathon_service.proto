syntax = "proto3";

package hackathon;

import "google/protobuf/empty.proto";
import "hackathon/messages/add_owner_request.proto";
import "hackathon/messages/add_page_request.proto";
import "hackathon/messages/add_page_response.proto";
import "hackathon/messages/create_hackathon_request.proto";
import "hackathon/messages/create_hackathon_response.proto";
import "hackathon/messages/delete_page_request.proto";
import "hackathon/messages/get_hackathon_request.proto";
import "hackathon/messages/get_hackathon_response.proto";
import "hackathon/messages/join_request.proto";
import "hackathon/messages/list_hackathon_request.proto";
import "hackathon/messages/list_hackathon_response.proto";
import "hackathon/messages/remove_owner_request.proto";
import "hackathon/messages/remove_participant_request.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

service HackathonSvc {
  rpc List(hackathon.messages.ListHackathonRequest) returns (hackathon.messages.ListHackathonResponse);
  rpc Get(hackathon.messages.GetHackathonRequest) returns (hackathon.messages.GetHackathonResponse);
  rpc Create(hackathon.messages.CreateHackathonRequest) returns (hackathon.messages.CreateHackathonResponse);
  rpc Join(hackathon.messages.JoinRequest) returns (google.protobuf.Empty);
  rpc RemoveParticipant(hackathon.messages.RemoveParticipantRequest) returns (google.protobuf.Empty);
  rpc AddOwner(hackathon.messages.AddOwnerRequest) returns (google.protobuf.Empty);
  rpc RemoveOwner(hackathon.messages.RemoveOwnerRequest) returns (google.protobuf.Empty);
  rpc AddPage(hackathon.messages.AddPageRequest) returns (hackathon.messages.AddPageResponse);
  rpc DeletePage(hackathon.messages.DeletePageRequest) returns (google.protobuf.Empty);
}
