syntax = "proto3";

package hackathon;

import "hackathon/messages/track_svc/get_request.proto";
import "hackathon/messages/track_svc/get_response.proto";
import "hackathon/messages/track_svc/list_request.proto";
import "hackathon/messages/track_svc/list_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

service TrackService {
  rpc List(hackathon.messages.track_svc.ListRequest) returns (hackathon.messages.track_svc.ListResponse);
  rpc Get(hackathon.messages.track_svc.GetRequest) returns (hackathon.messages.track_svc.GetResponse);
}
