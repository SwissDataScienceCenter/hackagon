syntax = "proto3";

package hackathon;

import "hackathon/messages/project_svc/approve_request.proto";
import "hackathon/messages/project_svc/approve_response.proto";
import "hackathon/messages/project_svc/delete_request.proto";
import "hackathon/messages/project_svc/delete_response.proto";
import "hackathon/messages/project_svc/disapprove_request.proto";
import "hackathon/messages/project_svc/disapprove_response.proto";
import "hackathon/messages/project_svc/edit_request.proto";
import "hackathon/messages/project_svc/edit_response.proto";
import "hackathon/messages/project_svc/export_preferences_request.proto";
import "hackathon/messages/project_svc/export_preferences_response.proto";
import "hackathon/messages/project_svc/get_request.proto";
import "hackathon/messages/project_svc/get_response.proto";
import "hackathon/messages/project_svc/list_request.proto";
import "hackathon/messages/project_svc/list_response.proto";
import "hackathon/messages/project_svc/propose_request.proto";
import "hackathon/messages/project_svc/propose_response.proto";
import "hackathon/messages/project_svc/remove_preference_request.proto";
import "hackathon/messages/project_svc/remove_preference_response.proto";
import "hackathon/messages/project_svc/set_preference_request.proto";
import "hackathon/messages/project_svc/set_preference_response.proto";

import "hackathon/messages/project_svc/get_preference_request.proto";
import "hackathon/messages/project_svc/get_preference_response.proto";
option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

service ProjectService {
  rpc List(hackathon.messages.project_svc.ListRequest) returns (hackathon.messages.project_svc.ListResponse);
  rpc Get(hackathon.messages.project_svc.GetRequest) returns (hackathon.messages.project_svc.GetResponse);
  rpc Propose(hackathon.messages.project_svc.ProposeRequest) returns (hackathon.messages.project_svc.ProposeResponse);
  rpc Approve(hackathon.messages.project_svc.ApproveRequest) returns (hackathon.messages.project_svc.ApproveResponse);
  rpc Disapprove(hackathon.messages.project_svc.DisapproveRequest) returns (hackathon.messages.project_svc.DisapproveResponse);
  rpc SetPreference(hackathon.messages.project_svc.SetPreferenceRequest) returns (hackathon.messages.project_svc.SetPreferenceResponse);
  // The caller's OWN preferences. ExportPreferences is organiser-only, so
  // until now a participant had no way to see what they had chosen.
  rpc GetPreference(hackathon.messages.project_svc.GetPreferenceRequest) returns (hackathon.messages.project_svc.GetPreferenceResponse);
  rpc ExportPreferences(hackathon.messages.project_svc.ExportPreferencesRequest) returns (hackathon.messages.project_svc.ExportPreferencesResponse);
  rpc Edit(hackathon.messages.project_svc.EditRequest) returns (hackathon.messages.project_svc.EditResponse);
  rpc Delete(hackathon.messages.project_svc.DeleteRequest) returns (hackathon.messages.project_svc.DeleteResponse);
  rpc RemovePreference(hackathon.messages.project_svc.RemovePreferenceRequest) returns (hackathon.messages.project_svc.RemovePreferenceResponse);
}
