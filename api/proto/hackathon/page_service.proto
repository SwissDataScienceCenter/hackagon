syntax = "proto3";

package hackathon;

import "hackathon/messages/page_svc/create_request.proto";
import "hackathon/messages/page_svc/create_response.proto";
import "hackathon/messages/page_svc/delete_request.proto";
import "hackathon/messages/page_svc/delete_response.proto";
import "hackathon/messages/page_svc/edit_request.proto";
import "hackathon/messages/page_svc/edit_response.proto";
import "hackathon/messages/page_svc/get_request.proto";
import "hackathon/messages/page_svc/get_response.proto";
import "hackathon/messages/page_svc/list_request.proto";
import "hackathon/messages/page_svc/list_response.proto";
import "hackathon/messages/page_svc/move_down_request.proto";
import "hackathon/messages/page_svc/move_down_response.proto";
import "hackathon/messages/page_svc/move_up_request.proto";
import "hackathon/messages/page_svc/move_up_response.proto";
import "hackathon/messages/page_svc/set_order_request.proto";
import "hackathon/messages/page_svc/set_order_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/hackathon";

service PageService {
  rpc List(hackathon.messages.page_svc.ListRequest) returns (hackathon.messages.page_svc.ListResponse);
  rpc Get(hackathon.messages.page_svc.GetRequest) returns (hackathon.messages.page_svc.GetResponse);
  rpc Create(hackathon.messages.page_svc.CreateRequest) returns (hackathon.messages.page_svc.CreateResponse);
  rpc Edit(hackathon.messages.page_svc.EditRequest) returns (hackathon.messages.page_svc.EditResponse);
  rpc Delete(hackathon.messages.page_svc.DeleteRequest) returns (hackathon.messages.page_svc.DeleteResponse);
  // Reordering methods - backend manages order uniqueness
  rpc MoveUp(hackathon.messages.page_svc.MoveUpRequest) returns (hackathon.messages.page_svc.MoveUpResponse);
  rpc MoveDown(hackathon.messages.page_svc.MoveDownRequest) returns (hackathon.messages.page_svc.MoveDownResponse);
  rpc SetOrder(hackathon.messages.page_svc.SetOrderRequest) returns (hackathon.messages.page_svc.SetOrderResponse);
}
