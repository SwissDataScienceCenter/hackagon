syntax = "proto3";

package user;

import "user/messages/add_role_request.proto";
import "user/messages/add_role_response.proto";
import "user/messages/register_request.proto";
import "user/messages/register_response.proto";
import "user/messages/remove_role_request.proto";
import "user/messages/remove_role_response.proto";
import "user/messages/user_get_request.proto";
import "user/messages/user_get_response.proto";
import "user/messages/user_list_request.proto";
import "user/messages/user_list_response.proto";
import "user/messages/who_am_i_request.proto";
import "user/messages/who_am_i_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto";

service UserSvc {
  rpc List(UserListRequest) returns (UserListResponse);
  rpc Get(UserGetRequest) returns (UserGetResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc AddRole(AddRoleRequest) returns (AddRoleResponse);
  rpc RemoveRole(RemoveRoleRequest) returns (RemoveRoleResponse);
}
