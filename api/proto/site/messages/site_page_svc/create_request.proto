syntax = "proto3";

package site.messages.site_page_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/site/messages/site_page_svc";

message CreateRequest {
  string slug = 1 [(buf.validate.field).string.pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"];
  string title = 2 [(buf.validate.field).string.min_len = 1];
  string content = 3;
  optional bool visible = 4;
  optional int32 order = 5;
}
