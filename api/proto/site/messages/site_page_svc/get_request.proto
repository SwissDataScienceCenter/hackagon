syntax = "proto3";

package site.messages.site_page_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/site/messages/site_page_svc";

// Pages are fetched by their stable slug — that is what the router has.
message GetRequest {
  string slug = 1 [(buf.validate.field).string.min_len = 1];
}
