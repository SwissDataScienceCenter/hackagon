syntax = "proto3";

package storage.messages.storage_svc;

import "buf/validate/validate.proto";
import "storage/entities/upload_kind.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/storage/messages/storage_svc";

// Ask for permission to upload one object. Nothing here names a path: the key
// is the server's to decide, so the worst a hostile client can do is ask for a
// kind it may not write, which casbin refuses.
//
// `content_type` and `size_bytes` are DECLARED here and then baked into the
// signature as conditions, which is what lets an oversized or wrong-typed
// upload be refused before a single byte moves. Declaring them falsely does not
// help: the object store recomputes the signature over the headers the browser
// actually sent, so a mismatch fails at the store.
message CreateUploadUrlRequest {
  storage.entities.UploadKind kind = 1 [
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.not_in = 0
  ];
  // The owning entity, read according to `kind` — see UploadKind.
  //
  // A uuid WHEN PRESENT, and empty is allowed, because whether an owner exists
  // at all depends on the kind: SITE_MEDIA files a platform page's imagery,
  // and a platform page belongs to no event and no person. Expressing
  // "required unless kind == SITE_MEDIA" here would need a message-level CEL
  // rule restating the kind table, so the per-kind requirement stays in
  // authorizeUpload, which is where the rest of that table already lives — the
  // kinds that DO name an owner still answer InvalidArgument for an empty one.
  string owner_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  // The user's own filename. Used only to cross-check the declared
  // content_type; the stored key gets a fresh uuid and an extension derived
  // from the content type, so nothing a user typed reaches the object store.
  string filename = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  string content_type = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 255
  }];
  // Exact byte length of the file about to be uploaded, not an estimate.
  int64 size_bytes = 5 [(buf.validate.field).int64.gt = 0];
}
