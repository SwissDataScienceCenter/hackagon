syntax = "proto3";

package health;

import "health/messages/health_check_request.proto";
import "health/messages/health_check_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/health";

service HealthSvc {
  rpc Check(health.messages.HealthCheckRequest) returns (health.messages.HealthCheckResponse);
}
