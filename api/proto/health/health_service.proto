syntax = "proto3";

package health;

import "health/messages/health_svc/check_request.proto";
import "health/messages/health_svc/check_response.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/health";

service HealthService {
  rpc Check(health.messages.health_svc.CheckRequest) returns (health.messages.health_svc.CheckResponse);
}
