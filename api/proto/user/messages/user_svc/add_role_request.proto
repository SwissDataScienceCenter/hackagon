syntax = "proto3";

package user.messages.user_svc;

import "buf/validate/validate.proto";
import "user/entities/global_role.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/user/messages/user_svc";

message AddRoleRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  user.entities.GlobalRole role = 2;
}
