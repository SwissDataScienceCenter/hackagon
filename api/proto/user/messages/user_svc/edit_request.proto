syntax = "proto3";

package user.messages.user_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/user/messages/user_svc";

message EditRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  optional string renku_url = 2 [(buf.validate.field).string.max_len = 2048];
  optional string github_url = 3 [(buf.validate.field).string.max_len = 2048];
  optional string linkedin_url = 4 [(buf.validate.field).string.max_len = 2048];
}
