syntax = "proto3";

package user.messages.user_svc;

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/user/messages/user_svc";

message EditRequest {
  string user_id = 1;
  optional string renku_url = 2;
  optional string github_url = 3;
  optional string linkedin_url = 4;
}
