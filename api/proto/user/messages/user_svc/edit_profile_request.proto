syntax = "proto3";

package user.messages.user_svc;

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/user/messages/user_svc";

// Edits the caller's own profile. There is no user id: the target is always
// the user the token belongs to. An absent field is left as is; an empty
// string clears the link.
message EditProfileRequest {
  optional string github_url = 1;
  optional string renku_url = 2;
  optional string linkedin_url = 3;
}
