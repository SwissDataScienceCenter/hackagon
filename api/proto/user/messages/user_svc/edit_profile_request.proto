syntax = "proto3";

package user.messages.user_svc;

import "buf/validate/validate.proto";

option go_package = "github.com/swissdatasciencecenter/hackagon/components/backend/internal/proto/user/messages/user_svc";

// Edits the caller's OWN profile — there is no user id, so this RPC can never
// touch anyone else's.
//
// Only the fields the platform owns are here. `username` and `email` come from
// Keycloak on every token and are re-synced by WhoAmI, so accepting them would
// be a lie: the next page load would overwrite whatever was stored. Those are
// changed in Keycloak's own account console.
//
// Every field is optional; absent means "leave unchanged".
message EditProfileRequest {
  optional string display_name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // The rest of the profile. Unlike display_name these MAY be cleared, so the
  // floor is 0: emptying "dietary requirements" is a legitimate edit, and a
  // min_len of 1 would make the field impossible to unset.
  optional string affiliation = 2 [(buf.validate.field).string.max_len = 200];
  optional string skills = 3 [(buf.validate.field).string.max_len = 500];
  optional string dietary = 4 [(buf.validate.field).string.max_len = 300];
  // A link, not an upload — there is no object store yet.
  //
  // Length only, deliberately: `uri: true` would reject the empty string, and
  // clearing your picture is a legitimate edit. The handler checks the SCHEME
  // instead (http/https only), which is the part that matters — a `javascript:`
  // or `data:` value must never reach an <img src>. Same reasoning the
  // hackathon logo field follows.
  optional string avatar_url = 5 [(buf.validate.field).string.max_len = 500];
}
