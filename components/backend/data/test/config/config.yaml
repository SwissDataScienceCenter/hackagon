server:
  port: "3000"
  adminemail: admin@hackagon.dev
  adminkeycloakid: "1183370a-46a2-4dad-b8fd-dd927d083e14"
database:
  driver: postgres
  host: localhost
  port: 5432
  dbname: hackagon
  user: postgres
  password: postgres
oidc:
  jwksurl: "http://localhost:8180/realms/hackagon/protocol/openid-connect/certs"
  issuerurl: "http://localhost:8180/realms/hackagon"
  algorithm: "RS256"
# S3-compatible object store for uploaded files: the `rustfs` container from
# .devcontainer/docker-compose.yml. Start it and create the bucket with
#   docker compose -f .devcontainer/docker-compose.yml up -d rustfs
#   bash .devcontainer/rustfs-init.sh
# Addressed by compose service name, not localhost like the other services:
# inside the dev container port 9000 is already Keycloak's management port,
# so there is nothing to bridge onto. Running the backend natively (no
# devcontainer)? Override with HACKAGON_STORAGE_ENDPOINT=http://localhost:9000.
#
# The credentials below are DEV-ONLY and worthless — same status as the
# postgres password above. A deployment supplies them from a secret store via
# HACKAGON_STORAGE_ACCESSKEY / HACKAGON_STORAGE_SECRETKEY.
storage:
  endpoint: "http://rustfs:9000"
  region: "us-east-1"
  bucket: "hackagon-dev"
  accesskey: "hackagon-dev"
  secretkey: "hackagon-dev-secret"
  usepathstyle: true
logging:
  level: info
# RPC journal: one JSON line per gRPC call, in the shape the e2e recipe uses.
# A LOCAL ANALYSIS TOOL — see docs/backend/rpc-journal.md for exactly what it
# records (actor username, method, allowlisted request fields, status code,
# response ids) and what it never reads (IP, user agent, session id, free
# text). Off here and off by default in code; env override
# HACKAGON_AUDIT_ENABLED=true. `path` is relative to components/backend.
audit:
  enabled: false
  path: ".output/audit/rpc-journal.jsonl"
