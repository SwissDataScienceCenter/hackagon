[request_definition]
# request = the question you ask, "can user sub do action act on object obj in a specific domain"
r = sub, domain, obj, act

[policy_definition]
# policies define the rules that govern the system
# sub = a role or * wildcard
# domain = domain the policy applies to, the domain is a hierarchical path starting with /, e.g. /hackathon/:hackathonId/team/:teamId
# obj & act = the action allowed on object for the matched role&domain
p = sub, domain, obj, act

[role_definition]
# role definitions work through pattern matching, they are the "data" of the rbac system, the data that the policies work on
# g is for domain specific roles, of the form (user, role, domain)
# e.g. "g, alice, owner, /hackathon/hackathon1" means alice has role owner in hackathon1
g = _, _, _
# g2 is for global roles, e.g. "g2, adminuser, admin" means user "adminuser" has role admin in ALL domains
g2 = _, _

[policy_effect]
# this contains rules on how effects of policies are combined. We don't specify effects, so every policy has the default "allow" effect
# below rule just means allow action if any policy matches
e = some(where (p.eft == allow))

[matchers]
# Decides whether one request (r) is allowed by one policy row (p). Casbin runs
# this against every row; the effect rule above allows if any row says yes.
#
# It reads as four AND-ed tests, with a single OR-ed escape hatch at the end:
#
#   ( subject matches ) && ( domain matches ) && ( object matches ) && ( action matches )
#   || user is a global admin
#
# Precedence matters: && binds tighter than ||, so the trailing
# `|| g2(r.sub, "admin")` sits OUTSIDE all four tests. A global admin is allowed
# regardless of domain, object and action.
#
# 1. subject — (g(r.sub, p.sub, r.domain) || g2(r.sub, p.sub) || p.sub == "*")
#    Three ways a user can satisfy the role named by the policy row:
#      g(r.sub, p.sub, r.domain)  the user holds that role in THIS domain, e.g.
#                                 "g, alice, owner, /hackathon/H1".
#      g2(r.sub, p.sub)           the user holds that role globally, in every
#                                 domain, e.g. "g2, alice, hackathon_organizer".
#      p.sub == "*"               the row grants the role to everyone, e.g. read
#                                 access on a public hackathon.
#
# 2. domain — globMatch(r.domain, p.domain)
#    Domains are hierarchical paths: /hackathon/<id>, /hackathon/<id>/team/<id>,
#    /hackathon/<id>/project/<id>. The request always carries a concrete path;
#    the policy row carries a pattern, so one row can cover every hackathon
#    (/hackathon/*) or every team (/hackathon/*/team/*).
#
#    globMatch is shell-style (doublestar.Match, pattern second): "*" matches
#    within one path segment and does NOT cross "/". So /hackathon/* matches
#    /hackathon/H1 but NOT /hackathon/H1/team/T7 — which is exactly what keeps
#    team- and project-scoped rows from leaking up to the whole hackathon.
#    Do not switch this to keyMatch: keyMatch truncates the pattern at its first
#    "*" and prefix-matches, so /hackathon/*/team/* would collapse to the prefix
#    /hackathon/ and grant every member every team's permissions.
#
#    Note the asymmetry with clause 1: role grants (g) are matched on the domain
#    EXACTLY, only policies (p) are pattern-matched. A user holding
#    "g, bob, member, /hackathon/H1/team/T7" is invisible to a request made
#    against /hackathon/H1 — the caller has to ask about the team path itself
#    (see mw.WithTeam / mw.WithProject in rbac.go).
#
# 3./4. object and action — r.obj == p.obj && r.act == p.act
#    Plain string equality, no wildcards.
m = (g(r.sub, p.sub, r.domain) || g2(r.sub, p.sub) || p.sub=="*") && globMatch(r.domain, p.domain) && r.obj == p.obj && r.act == p.act || g2(r.sub, "admin")
