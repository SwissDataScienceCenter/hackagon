name: backend
version: 0.1.0
language: go

targets:
  build:
    steps:
      - runner: go
      # - runner: git-diff
      #   config:
      #     paths:
      #       - pkg

  lint:
    steps:
      - runner: go
        config:
          checkBuildConstraints:
            enable: true
            rules:
              - includePatterns:
                  ["**/internal/**/*_test.go", "**/pkg/**/*_test.go"]
                constraints: ["test && unittest"]
              - includePatterns: ["**/test/**/*_test.go"]
                constraints: ["test && integration"]

  image:
    steps:
      - runner: nix

  build-nix:
    stage: "aux"
    steps:
      - runnerID: quitsh::build-go
  test-nix:
    stage: "aux"
    steps:
      - runnerID: quitsh::test-go
