name: backend
version: 0.1.0
language: go

targets:
  build:
    steps:
      - runner: go
      # - runner: git-diff
      #   config:
      #     paths:
      #       - pkg

  test-unittest:
    steps:
      - runner: go
        config:
          buildTags: ["test", "unittest"]
          args:
            - "-coverpkg=github.com/swissdatasciencecenter/hackagon/components/backend/cmd/...,github.com/swissdatasciencecenter/hackagon/components/backend/internal/..."
    inputs: ["self"]

  lint:
    steps:
      - runner: go
        config:
          checkBuildConstraints:
            enable: true
            rules:
              - includePatterns:
                  ["**/internal/**/*_test.go", "**/pkg/**/*_test.go"]
                constraints: ["test && unittest"]

  image:
    steps:
      - runner: nix

  build-nix:
    stage: "aux"
    steps:
      - runnerID: quitsh::build-go
  test-nix:
    stage: "aux"
    steps:
      - runnerID: quitsh::test-go
