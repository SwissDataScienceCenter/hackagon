<!doctype html>
<html lang="en" data-theme="Hackathonsdsc" data-mode="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/favicon.png" />
    <!-- Colours the browser chrome on mobile: the SDSC green the rest of the
         UI is built on. -->
    <meta name="theme-color" content="#83b91d" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="min-h-screen overflow-x-hidden overflow-y-auto"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
