# -- Base domain for all external services
baseDomain: "example.com"

# -- Keycloak realm JSON (pass via --set-file: --set-file realmJson=@./tools/configs/keycloak/realm-hackagon.json)
# realmJson: ""

# ============================================================
# Images
# ============================================================
# An image address is `repository:tag`. Two repositories exist:
#   release/    one image per `v*` tag       — what prod runs
#   temporary/  one image per push to main   — what dev runs, moves constantly
#
# Image tags default to the Chart's appVersion.
#
# A cluster that should follow `main` instead overrides two keys per component:
#   --set frontend.image.repository=<registry>/temporary/frontend-service
#   --set frontend.image.tag=latest
#
# `pullPolicy` is empty below so Kubernetes can apply its own rule.
#
# ============================================================
# Frontend
# ============================================================
frontend:
  image:
    repository: ghcr.io/swissdatasciencecenter/hackagon/release/frontend-service
    # Empty: falls back to .Chart.AppVersion.
    tag: ""
    # Empty: the field is omitted and Kubernetes picks.
    pullPolicy: ""

  replicaCount: 1
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Frontend config.yaml content (non-sensitive settings)
  config:
    log:
      forceDevLog: false
    backend:
      hostname: hackagon-backend
      port: 3000
    cookies:
      useSecure: true
    oidc:
      clientId: hackagon-frontend
      audience: hackagon-backend

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    ingressClass: "webapprouting.kubernetes.azure.com"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      nginx.ingress.kubernetes.io/client-header-buffer-size: 16k
      nginx.ingress.kubernetes.io/large-client-header-buffers: 4 16k
      nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
      nginx.ingress.kubernetes.io/proxy-buffers: 8 16k
      nginx.ingress.kubernetes.io/proxy_busy_buffers_size: 32k
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # -- Public hostname of the app. The TLS host below and the realm's login
    # Redirects follow the first entry.
    hosts:
      # You can overwrite this default to any hard-coded custom domain,
      # e.g. host: "hackagon.datascience.ch".
      - host: "app.{{ .Values.baseDomain }}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: '{{ .Release.Name }}-frontend-tls'
        hosts:
          # Evaluates to the first host in frontend.ingress.hosts
          - '{{ include "hackagon.frontendHost" . }}'  

# ============================================================
# Backend
# ============================================================
backend:
  image:
    repository: ghcr.io/swissdatasciencecenter/hackagon/release/backend-service
    # Empty: falls back to .Chart.AppVersion.
    tag: ""
    # Empty: the field is omitted and Kubernetes picks.
    pullPolicy: ""

  replicaCount: 1
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # -- Backend config.yaml content
  config:
    server:
      port: "3000"
      adminemail: "admin@{{ .Values.baseDomain }}"
      # -- Keycloak user id of the platform admin. Must equal the `id` of the
      # `hackagon-admin` user in realmJson: casbin grants the `admin` role to
      # exactly this id, and the backend seeds the admin row by it. Importing
      # the realm keeps the two in step; an admin created by hand in the
      # console gets a fresh uuid instead, which leaves nobody an admin and
      # reports no error. Required — the backend refuses to start when empty.
      adminkeycloakid: ""
    database:
      driver: postgres
      # -- Postgres host the backend connects to. Empty falls back to the
      # bundled subchart's service (`<release>-postgresql`). Set it to reach a
      # postgres this chart does not manage — a managed provider, or one
      # installed under a different release name. Rendered with `tpl`.
      host: ""
      port: 5432
      dbname: hackagon
      user: hackagon
      # -- Password for `user`. The chart puts it in a Secret of its own and
      # injects it as an env var, never into the backend ConfigMap. 
      postgresPassword: "" # Only use it existingSecret is empty
      # -- Read the password from a Secret you already have instead of letting
      # the chart manage one. Required by a postgres operator or an external
      # secret store, which writes the credentials before the chart runs.
      # Incompatible with `postgresql.enabled`: the bundled postgres bootstraps
      # its roles from an init script and cannot read a Secret.
      existingSecret: ""
      # -- Key inside `existingSecret` holding the password.
      existingSecretPasswordKey: password
    oidc:
      # -- Where the backend fetches Keycloak's signing keys.
      # With an external Keycloak (keycloak.enabled: false),
      # override this with a url the backend pod can actually reach.
      # the issuer is derived from the keycloak hostname and injected in configmaps.
      jwksurl: 'http://{{ include "hackagon.keycloakServiceName" . }}:8080/realms/hackagon/protocol/openid-connect/certs'
      algorithm: RS256
    logging:
      level: info

  service:
    type: ClusterIP
    port: 3000

# ============================================================
# Keycloak (helmforge)
# ============================================================
keycloak:
  enabled: true
  replicaCount: 1

  # -- Production mode requires hostname and database
  mode: production

  # -- Public url Keycloak runs under; the auth hostname and the OIDC issuer
  # derive from it. Required. Passed verbatim to the subchart, so `{...}`
  # placeholders are not substituted here. e.g. "https://auth.example.com"
  hostname:
    hostname: ""

  # -- Keycloak's own console admin, which lives in the `master` realm. Its
  # password is NOT in realmJson: a realm export carries only that realm's
  # users, and this account is not one of them. This chart declares no password
  # for it — set the keycloak subchart's own bootstrap-admin password, from a
  # Secret.
  # Mind the name collision: `hackagon-admin` is also a user *inside* the
  # hackagon realm (the platform admin, see server.adminkeycloakid below). Two
  # different accounts, two different passwords.
  admin:
    username: hackagon-admin

  # -- External database. Points at the bundled postgres by default, but any
  # reachable postgres works. These keys are passed to the keycloak subchart
  # verbatim, so they must use its names (`name`/`username`, not
  # `database`/`user`).
  database:
    external:
      vendor: postgres
      # -- Required: <release>-postgresql (e.g. "hackagon-postgresql") for the
      # bundled postgres, otherwise the external host.
      host: ""
      port: 5432
      name: keycloak
      username: keycloak
      password: "" # Only use it existingSecret is empty
      # -- Read the password from a Secret you already have. Handled by the
      # keycloak subchart. Incompatible with `postgresql.enabled`, for the same
      # reason as the backend's.
      existingSecret: ""
      # -- Key inside `existingSecret` holding the password.
      existingSecretPasswordKey: password

  # -- Realm import from ConfigMap
  realmImport:
    enabled: true
    existingConfigMap: hackagon-realm

  # -- Persistence (for Keycloak data, not DB)
  persistence:
    enabled: true
    size: 10Gi

  # -- Resources
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # -- Proxy configuration (behind reverse proxy)
  proxy:
    headers: xforwarded

  # -- Ingress for Keycloak (managed by parent chart)
  ingress:
    enabled: false

# -- Ingress for the Keycloak service. Not under `keycloak`, whose keys are
# passed to the keycloak subchart.
keycloakIngress:
  enabled: true
  ingressClass: webapprouting.kubernetes.azure.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
# ============================================================
# PostgreSQL (bitnami) — two databases, two users
# ============================================================
# Set `enabled: false` to run against a postgres this chart does not install.
# Then create the `hackagon` and `keycloak` roles and databases yourself, point
# `backend.config.database.host` and `keycloak.database.external.host` at it,
# and supply the passwords — either directly or from existing Secrets.
postgresql:
  enabled: true
  auth:
    username: postgres
    database: postgres
    # -- The bitnami subchart also accepts `auth.existingSecret` together with
    # `auth.secretKeys.adminPasswordKey`, if you would rather not put the
    # superuser password in values.
    postgresPassword: ""

  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    initdb:
      scriptsConfigMap: hackagon-keycloak-init

# ============================================================
# Frontend OIDC secrets
# ============================================================
frontendSecrets:
  clientSecret: ""
  authSecret: ""
