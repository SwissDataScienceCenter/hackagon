# -- Base domain for all external services
baseDomain: "example.com"

# -- Keycloak realm JSON (pass via --set-file: --set-file realmJson=@./tools/configs/keycloak/realm-hackagon.json)
# realmJson: ""

# ============================================================
# Frontend
# ============================================================
frontend:
  image:
    repository: ghcr.io/swissdatasciencecenter/hackagon/temporary/frontend-service
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # -- Frontend config.yaml content (non-sensitive settings)
  config:
    log:
      forceDevLog: false
    backend:
      hostname: hackagon-backend
      port: 3000
    cookies:
      useSecure: true
    oidc:
      clientId: hackagon-frontend
      issuer: "https://auth.{baseDomain}/realms/hackagon"
      audience: hackagon-backend

  service:
    type: ClusterIP
    port: 8080

  ingress:
    enabled: true
    ingressClass: "webapprouting.kubernetes.azure.com"
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-production
      nginx.ingress.kubernetes.io/client-header-buffer-size: 16k
      nginx.ingress.kubernetes.io/large-client-header-buffers: 4 16k
      nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
      nginx.ingress.kubernetes.io/proxy-buffers: 8 16k
      nginx.ingress.kubernetes.io/proxy_busy_buffers_size: 32k
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - host: "app.{baseDomain}"
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: "{releaseName}-frontend-tls"
        hosts:
          - "app.{baseDomain}"

# ============================================================
# Backend
# ============================================================
backend:
  image:
    repository: ghcr.io/swissdatasciencecenter/hackagon/temporary/backend-service
    tag: "latest"
    pullPolicy: IfNotPresent

  replicaCount: 1
  annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

  # -- Backend config.yaml content
  config:
    server:
      port: "3000"
      adminemail: "admin@{baseDomain}"
      adminkeycloakid: ""
    database:
      driver: postgres
      host: "" # Auto-generated from release name in template
      port: 5432
      dbname: hackagon
      user: hackagon
      postgresPassword: ""
    oidc:
      # -- Where the backend fetches Keycloak's signing keys.
      # With an external Keycloak (keycloak.enabled: false),
      # override this with a url the backend pod can actually reach.
      jwksurl: "http://{keycloakService}:8080/realms/hackagon/protocol/openid-connect/certs"
      # -- Must stay the PUBLIC url: this is the `iss` claim Keycloak stamps into
      # tokens, and the backend rejects any token whose issuer does not match.
      issuerurl: "https://auth.{baseDomain}/realms/hackagon"
      algorithm: RS256
    logging:
      level: info

  service:
    type: ClusterIP
    port: 3000

# ============================================================
# Keycloak (helmforge)
# ============================================================
keycloak:
  enabled: true
  replicaCount: 1

  # -- Production mode requires hostname and database
  mode: production

  # -- Hostname for Keycloak (public admin UI)
  hostname:
    hostname: "" # e.g. "https://auth.{baseDomain}"

  # -- Admin credentials (password from realm JSON, but username needed)
  admin:
    username: hackagon-admin

  # -- External database (reuse the same postgres instance)
  database:
    external:
      vendor: postgres
      host: "" # Required: set to <release>-postgresql (e.g. "hackagon-postgresql")
      port: 5432
      database: keycloak
      user: keycloak
      password: ""

  # -- Realm import from ConfigMap
  realmImport:
    enabled: true
    existingConfigMap: hackagon-realm

  # -- Persistence (for Keycloak data, not DB)
  persistence:
    enabled: true
    size: 10Gi

  # -- Resources
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # -- Proxy configuration (behind reverse proxy)
  proxy:
    headers: xforwarded

  # -- Ingress for Keycloak (managed by parent chart)
  ingress:
    enabled: false

# ============================================================
# PostgreSQL (bitnami) — two databases, two users
# ============================================================
postgresql:
  enabled: true
  auth:
    username: postgres
    database: postgres
    postgresPassword: ""

  primary:
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    initdb:
      scriptsConfigMap: hackagon-keycloak-init

# ============================================================
# Frontend OIDC secrets
# ============================================================
frontendSecrets:
  clientSecret: ""
  authSecret: ""
