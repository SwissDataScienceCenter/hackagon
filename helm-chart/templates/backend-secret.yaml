{{- if not .Values.backend.config.database.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-backend-db" (include "hackagon.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hackagon.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  {{ include "hackagon.backendDatabaseSecretKey" . }}: {{ .Values.backend.config.database.postgresPassword | required "backend.config.database.postgresPassword is required unless backend.config.database.existingSecret is set" | quote }}
{{- end }}
