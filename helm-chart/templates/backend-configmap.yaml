{{- if and (contains "hackagon.keycloakServiceName" .Values.backend.config.oidc.jwksurl) (not .Values.keycloak.enabled) -}}
{{- fail "backend.config.oidc.jwksurl points at the in-cluster Keycloak, but keycloak.enabled is false: set it to the external Keycloak's certs endpoint" -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hackagon.fullname" . }}-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hackagon.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: {{ .Values.backend.config.server.port | quote }}
      adminemail: {{ tpl .Values.backend.config.server.adminemail . | quote }}
      adminkeycloakid: {{ .Values.backend.config.server.adminkeycloakid | quote }}
    database:
      driver: {{ .Values.backend.config.database.driver | quote }}
      host: {{ include "hackagon.backendDatabaseHost" . | quote }}
      port: {{ .Values.backend.config.database.port }}
      dbname: {{ .Values.backend.config.database.dbname | quote }}
      user: {{ .Values.backend.config.database.user | quote }}
      # No `password` here on purpose: a ConfigMap is world-readable to anything
      # that can read the namespace. The backend reads it from the environment
      # instead (HACKAGON_DATABASE_PASSWORD, set from a Secret in
      # backend-deployment.yaml), which koanf layers over this file.
    oidc:
      jwksurl: {{ tpl .Values.backend.config.oidc.jwksurl . | quote }}
      issuerurl: {{ include "hackagon.oidcIssuer" . | quote }}
      algorithm: {{ .Values.backend.config.oidc.algorithm | quote }}
    logging:
      level: {{ .Values.backend.config.logging.level | quote }}
