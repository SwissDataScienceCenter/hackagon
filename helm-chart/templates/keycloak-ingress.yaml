{{- if .Values.keycloakIngress.enabled }}
{{- $keycloakHost := include "hackagon.keycloakHost" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hackagon.fullname" . }}-keycloak
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hackagon.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- with .Values.keycloakIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.keycloakIngress.ingressClass }}
  rules:
    - host: {{ $keycloakHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hackagon.keycloakServiceName" . }}
                port:
                  number: 8080
  tls:
    - hosts:
        - {{ $keycloakHost }}
      secretName: {{ include "hackagon.fullname" . }}-keycloak-tls
{{- end }}
