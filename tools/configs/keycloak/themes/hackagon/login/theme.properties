# Hackagon login theme — extends the stock keycloak.v2 (PatternFly v5) theme
# with the platform's branding (SDSC green, mono font, light/dark logos).
# Wired via spi-theme--folder--dir in tools/nix/hackagon/lib/toolchain.nix;
# the realm selects it through loginTheme in realm-hackagon.json.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/hackagon.css
darkMode=true
