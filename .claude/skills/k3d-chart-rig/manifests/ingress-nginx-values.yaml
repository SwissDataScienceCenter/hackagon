# ingress-nginx for the k3d rig.
#
# k3d ships TRAEFIK, and every annotation the chart writes on its /objects
# Ingress (`nginx.ingress.kubernetes.io/upstream-vhost`, `rewrite-target`,
# `use-regex`, `proxy-body-size`) is ingress-nginx's. On Traefik the Host
# rewrite is not expressible in a core Ingress object at all — it needs a
# Traefik CRD — so with the bundled controller the one thing this rig exists to
# test cannot work. `up.sh` therefore creates the cluster with
# `--disable=traefik` and installs this instead.
#
# THE PORT IS THE INTERESTING PART. The controller Service listens on 8090, not
# 80, so that the port in the public URL is the same port the cluster's own DNS
# answer reaches. Keycloak's issuer is ONE string: the browser fetches
# `http://auth.hackagon.localhost:8090/realms/hackagon` and the frontend pod
# fetches the discovery document from the same string. If the in-cluster
# listener were on :80 the two could not agree, and Auth.js rejects a discovery
# document whose `issuer` differs from the configured one.
#
# k3s's ServiceLB turns a LoadBalancer Service into a DaemonSet with
# hostPort: 8090 on the node, and k3d publishes host 8090 to that same node
# port — so one number runs the whole way through.
controller:
  replicaCount: 1

  ingressClassResource:
    name: nginx
    enabled: true
    default: true
  ingressClass: nginx
  # An Ingress with no class must NOT be picked up: the point of this rig is to
  # observe that the chart's own ingressClassName selects this controller.
  watchIngressWithoutClass: false

  service:
    type: LoadBalancer
    ports:
      http: 8090
      https: 8443
    targetPorts:
      http: http
      https: https

  # Snippets stay off. Nothing in helm-chart/ uses them, and leaving them
  # enabled would let a rig-only annotation stand in for a chart-only one.
  allowSnippetAnnotations: false

  resources:
    requests:
      cpu: 50m
      memory: 90Mi

  admissionWebhooks:
    enabled: true

  # A single-node cluster: no reason to spread or to keep a second copy.
  minAvailable: 0

defaultBackend:
  enabled: false
