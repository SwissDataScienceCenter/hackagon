# What `just docs::screenshots <page>...` photographs: one entry per entry of a
# hackathon's sidebar, named after the doc page it belongs to
# (src/<guide>/<page>.md). Each picture is saved to
# src/static/screenshots/<page>.png; that folder belongs to the script, so put
# hand-made images anywhere else under src/static/.
#
#   nav        the sidebar entry's id, which the script clicks (data-nav-id)
#   user       a seeded login; every one has the password `aliceandbob`
#   hackathon  a seeded hackathon by name, since ids change on every re-seed
#
# Pick a hackathon where the entry exists: Teams needs teams, Voting and
# Results need their capability on, Timeline needs a phase, Manage Tracks a
# track, Invitations a private hackathon. components/backend/cmd/seed/README.md
# says which hackathon is in which state.

