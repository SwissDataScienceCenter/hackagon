<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Level 2 — Containers">
  <title>Level 2 — Containers</title>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t-title{font-size:13px;font-weight:650}
    .t-tech{font-size:9.5px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
    .t-desc{font-size:10px}
    .t-rel{font-size:9.5px}
    .t-cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
    @media (prefers-color-scheme: dark){
      .bg{fill:#121213}
      .ink{fill:#f2f1ec} .ink2{fill:#c6c5be} .ink3{fill:#8d8c85}
      .b-person{fill:#40607d;stroke:#5a7c9c} .b-sys{fill:#2f6fb5;stroke:#4d8bcd}
      .b-cont{fill:#1e2f42;stroke:#3f6187}  .b-comp{fill:#1a2836;stroke:#3f6187}
      .b-mw{fill:#2c2519;stroke:#5a4a2c}    .b-db{fill:#17322a;stroke:#3d6b58}
      .b-ext{fill:#232421;stroke:#4a4b47}   .b-planned{fill:#1b1c1a;stroke:#4a4b47}
      .on-dark{fill:#f2f1ec}
      .rel-line{stroke:#8d8c85} .rel-chip{fill:#121213}
      .boundary{stroke:#4a4b47}
      .arrowhead{fill:#8d8c85}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 1 L9 5 L0 9 z" fill="#7b7972"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 1 L9 5 L0 9 z" fill="#b6b4aa"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="560" fill="#faf9f6"/>
  <text class="t-cap ink3" x="20" y="26" fill="#7b7972">LEVEL 2 — CONTAINERS</text>
  <rect class="boundary" x="328" y="119" width="344" height="291" rx="10" fill="none" stroke="#b6b4aa" stroke-width="1.25" stroke-dasharray="7 5"/><text class="t-cap ink3" fill="#7b7972" x="338" y="111">HACKAGON</text><g><rect class="b-person" x="297" y="46" width="190" height="41" rx="7" fill="#2c4a63" stroke="#22394c" stroke-width="1.25"/><text class="t-title ink on-dark" x="392" y="70" text-anchor="middle" fill="#ffffff">Participant</text></g><g><rect class="b-person" x="513" y="46" width="190" height="41" rx="7" fill="#2c4a63" stroke="#22394c" stroke-width="1.25"/><text class="t-title ink on-dark" x="608" y="70" text-anchor="middle" fill="#ffffff">Organizer</text></g><g><rect class="b-cont" x="350" y="145" width="300" height="99" rx="7" fill="#dbe7f4" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="500" y="169" text-anchor="middle" fill="#17171a">Frontend (BFF)</text><text class="t-tech ink3" x="500" y="188" text-anchor="middle" fill="#7b7972">SvelteKit SSR, adapter-node</text><text class="t-desc ink2" x="500" y="205" text-anchor="middle" fill="#4c4b48">Server-side rendered UI. The only gRPC client —</text><text class="t-desc ink2" x="500" y="218" text-anchor="middle" fill="#4c4b48">translates gRPC errors to HTTP and holds the</text><text class="t-desc ink2" x="500" y="231" text-anchor="middle" fill="#4c4b48">session.</text></g><g><rect class="b-cont" x="350" y="302" width="300" height="86" rx="7" fill="#dbe7f4" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="500" y="326" text-anchor="middle" fill="#17171a">Backend</text><text class="t-tech ink3" x="500" y="345" text-anchor="middle" fill="#7b7972">Go, gRPC</text><text class="t-desc ink2" x="500" y="362" text-anchor="middle" fill="#4c4b48">Domain services behind auth + casbin interceptors.</text><text class="t-desc ink2" x="500" y="375" text-anchor="middle" fill="#4c4b48">Stateless except the in-memory casbin policy.</text></g><g><rect class="b-db" x="247" y="446" width="240" height="73" rx="7" fill="#d9ece3" stroke="#84b9a2" stroke-width="1.25"/><text class="t-title ink" x="367" y="470" text-anchor="middle" fill="#17171a">Postgres</text><text class="t-tech ink3" x="367" y="489" text-anchor="middle" fill="#7b7972">ent ORM · :5432</text><text class="t-desc ink2" x="367" y="506" text-anchor="middle" fill="#4c4b48">Entities and the casbin policy table.</text></g><g><rect class="b-ext" x="513" y="446" width="240" height="86" rx="7" fill="#e8e7e1" stroke="#b6b4aa" stroke-width="1.25"/><text class="t-title ink" x="633" y="470" text-anchor="middle" fill="#17171a">Keycloak</text><text class="t-tech ink3" x="633" y="489" text-anchor="middle" fill="#7b7972">OIDC · :8180</text><text class="t-desc ink2" x="633" y="506" text-anchor="middle" fill="#4c4b48">Identity provider. Dev storage is H2</text><text class="t-desc ink2" x="633" y="519" text-anchor="middle" fill="#4c4b48">(gap I2).</text></g><path class="rel-line" d="M392 87 C392 116, 500 116, 500 138" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="428.25" y="109" width="35.5" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="446" y="119" text-anchor="middle" fill="#7b7972">HTTPS</text><path class="rel-line" d="M608 87 C608 116, 500 116, 500 138" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="536.25" y="109" width="35.5" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="554" y="119" text-anchor="middle" fill="#7b7972">HTTPS</text><path class="rel-line" d="M500 244 L500 295" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="446.55" y="266" width="106.89999999999999" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="500" y="276" text-anchor="middle" fill="#7b7972">gRPC · bearer token</text><path class="rel-line" d="M500 388 C500 417, 367 417, 367 439" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="420.85" y="410" width="25.299999999999997" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="433.5" y="420" text-anchor="middle" fill="#7b7972">SQL</text><path class="rel-line" d="M500 388 C500 417, 633 417, 633 439" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="551.3" y="410" width="30.4" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="566.5" y="420" text-anchor="middle" fill="#7b7972">JWKS</text>
</svg>