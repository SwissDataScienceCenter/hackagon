<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 695" width="1120" height="695" role="img" aria-label="Level 3 — Backend components">
  <title>Level 3 — Backend components</title>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t-title{font-size:13px;font-weight:650}
    .t-tech{font-size:9.5px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
    .t-desc{font-size:10px}
    .t-rel{font-size:9.5px}
    .t-cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
    @media (prefers-color-scheme: dark){
      .bg{fill:#121213}
      .ink{fill:#f2f1ec} .ink2{fill:#c6c5be} .ink3{fill:#8d8c85}
      .b-person{fill:#40607d;stroke:#5a7c9c} .b-sys{fill:#2f6fb5;stroke:#4d8bcd}
      .b-cont{fill:#1e2f42;stroke:#3f6187}  .b-comp{fill:#1a2836;stroke:#3f6187}
      .b-mw{fill:#2c2519;stroke:#5a4a2c}    .b-db{fill:#17322a;stroke:#3d6b58}
      .b-ext{fill:#232421;stroke:#4a4b47}   .b-planned{fill:#1b1c1a;stroke:#4a4b47}
      .on-dark{fill:#f2f1ec}
      .rel-line{stroke:#8d8c85} .rel-chip{fill:#121213}
      .boundary{stroke:#4a4b47}
      .arrowhead{fill:#8d8c85}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 1 L9 5 L0 9 z" fill="#7b7972"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 1 L9 5 L0 9 z" fill="#b6b4aa"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1120" height="695" fill="#faf9f6"/>
  <text class="t-cap ink3" x="20" y="26" fill="#7b7972">LEVEL 3 — BACKEND COMPONENTS</text>
  <rect class="boundary" x="40" y="127" width="1040" height="431" rx="10" fill="none" stroke="#b6b4aa" stroke-width="1.25" stroke-dasharray="7 5"/><text class="t-cap ink3" fill="#7b7972" x="50" y="119">BACKEND</text><g><rect class="b-cont" x="430" y="46" width="260" height="55" rx="7" fill="#dbe7f4" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="560" y="70" text-anchor="middle" fill="#17171a">Frontend (BFF)</text><text class="t-tech ink3" x="560" y="89" text-anchor="middle" fill="#7b7972">the only gRPC client</text></g><g><rect class="b-mw" x="317" y="151" width="230" height="55" rx="7" fill="#f3ece0" stroke="#d3bf9e" stroke-width="1.25"/><text class="t-title ink" x="432" y="175" text-anchor="middle" fill="#17171a">Auth interceptor</text><text class="t-tech ink3" x="432" y="194" text-anchor="middle" fill="#7b7972">middleware/auth.go</text></g><g><rect class="b-mw" x="573" y="151" width="230" height="55" rx="7" fill="#f3ece0" stroke="#d3bf9e" stroke-width="1.25"/><text class="t-title ink" x="688" y="175" text-anchor="middle" fill="#17171a">Casbin enforcer</text><text class="t-tech ink3" x="688" y="194" text-anchor="middle" fill="#7b7972">middleware/rbac.go</text></g><g><rect class="b-comp" x="223" y="256" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="299" y="280" text-anchor="middle" fill="#17171a">HealthService</text><text class="t-tech ink3" x="299" y="299" text-anchor="middle" fill="#7b7972">1 RPCs</text></g><g><rect class="b-comp" x="397" y="256" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="473" y="280" text-anchor="middle" fill="#17171a">UserService</text><text class="t-tech ink3" x="473" y="299" text-anchor="middle" fill="#7b7972">8 RPCs</text></g><g><rect class="b-comp" x="571" y="256" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="647" y="280" text-anchor="middle" fill="#17171a">HackathonService</text><text class="t-tech ink3" x="647" y="299" text-anchor="middle" fill="#7b7972">22 RPCs</text></g><g><rect class="b-comp" x="745" y="256" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="821" y="280" text-anchor="middle" fill="#17171a">PageService</text><text class="t-tech ink3" x="821" y="299" text-anchor="middle" fill="#7b7972">8 RPCs</text></g><g><rect class="b-comp" x="223" y="327" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="299" y="351" text-anchor="middle" fill="#17171a">PhaseService</text><text class="t-tech ink3" x="299" y="370" text-anchor="middle" fill="#7b7972">5 RPCs</text></g><g><rect class="b-comp" x="397" y="327" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="473" y="351" text-anchor="middle" fill="#17171a">TrackService</text><text class="t-tech ink3" x="473" y="370" text-anchor="middle" fill="#7b7972">5 RPCs</text></g><g><rect class="b-comp" x="571" y="327" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="647" y="351" text-anchor="middle" fill="#17171a">ProjectService</text><text class="t-tech ink3" x="647" y="370" text-anchor="middle" fill="#7b7972">11 RPCs</text></g><g><rect class="b-comp" x="745" y="327" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="821" y="351" text-anchor="middle" fill="#17171a">TeamService</text><text class="t-tech ink3" x="821" y="370" text-anchor="middle" fill="#7b7972">12 RPCs</text></g><g><rect class="b-comp" x="223" y="398" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="299" y="422" text-anchor="middle" fill="#17171a">VoteService</text><text class="t-tech ink3" x="299" y="441" text-anchor="middle" fill="#7b7972">15 RPCs</text></g><g><rect class="b-comp" x="397" y="398" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="473" y="422" text-anchor="middle" fill="#17171a">ConfigService</text><text class="t-tech ink3" x="473" y="441" text-anchor="middle" fill="#7b7972">9 RPCs</text></g><g><rect class="b-comp" x="571" y="398" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="647" y="422" text-anchor="middle" fill="#17171a">PrizeService</text><text class="t-tech ink3" x="647" y="441" text-anchor="middle" fill="#7b7972">4 RPCs</text></g><g><rect class="b-comp" x="745" y="398" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="821" y="422" text-anchor="middle" fill="#17171a">SitePageService</text><text class="t-tech ink3" x="821" y="441" text-anchor="middle" fill="#7b7972">5 RPCs</text></g><g><rect class="b-comp" x="484" y="469" width="152" height="55" rx="7" fill="#eaf1f9" stroke="#8fb2d6" stroke-width="1.25"/><text class="t-title ink" x="560" y="493" text-anchor="middle" fill="#17171a">StorageService</text><text class="t-tech ink3" x="560" y="512" text-anchor="middle" fill="#7b7972">2 RPCs</text></g><g><rect class="b-db" x="430" y="612" width="260" height="55" rx="7" fill="#d9ece3" stroke="#84b9a2" stroke-width="1.25"/><text class="t-title ink" x="560" y="636" text-anchor="middle" fill="#17171a">Postgres</text><text class="t-tech ink3" x="560" y="655" text-anchor="middle" fill="#7b7972">entities + casbin policy</text></g><path class="rel-line" d="M560 101 C560 126, 432 126, 432 144" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="480.8" y="119" width="30.4" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="496" y="129" text-anchor="middle" fill="#7b7972">gRPC</text><path class="rel-line" d="M547 178.5 L566 178.5" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="539.7" y="170.5" width="40.599999999999994" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="560" y="181.5" text-anchor="middle" fill="#7b7972">claims</text><path class="rel-line" d="M688 206 C688 231, 560 231, 560 249" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="593.5" y="224" width="61" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="624" y="234" text-anchor="middle" fill="#7b7972">authorized</text><path class="rel-line" d="M560 524 L560 605" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="547.35" y="561" width="25.299999999999997" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="560" y="571" text-anchor="middle" fill="#7b7972">SQL</text><rect class="rel-chip" x="313.4" y="533" width="493.20000000000005" height="18" rx="5" fill="#faf9f6"/><text class="t-desc ink2" fill="#4c4b48" x="560" y="546" text-anchor="middle">every service is reached through the same interceptor chain, and shares the one database</text>
</svg>