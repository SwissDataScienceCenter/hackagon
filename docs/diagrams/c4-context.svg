<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 493" width="1000" height="493" role="img" aria-label="Level 1 — System context">
  <title>Level 1 — System context</title>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    .t-title{font-size:13px;font-weight:650}
    .t-tech{font-size:9.5px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace}
    .t-desc{font-size:10px}
    .t-rel{font-size:9.5px}
    .t-cap{font-size:10.5px;font-weight:700;letter-spacing:.08em}
    @media (prefers-color-scheme: dark){
      .bg{fill:#121213}
      .ink{fill:#f2f1ec} .ink2{fill:#c6c5be} .ink3{fill:#8d8c85}
      .b-person{fill:#40607d;stroke:#5a7c9c} .b-sys{fill:#2f6fb5;stroke:#4d8bcd}
      .b-cont{fill:#1e2f42;stroke:#3f6187}  .b-comp{fill:#1a2836;stroke:#3f6187}
      .b-mw{fill:#2c2519;stroke:#5a4a2c}    .b-db{fill:#17322a;stroke:#3d6b58}
      .b-ext{fill:#232421;stroke:#4a4b47}   .b-planned{fill:#1b1c1a;stroke:#4a4b47}
      .on-dark{fill:#f2f1ec}
      .rel-line{stroke:#8d8c85} .rel-chip{fill:#121213}
      .boundary{stroke:#4a4b47}
      .arrowhead{fill:#8d8c85}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 1 L9 5 L0 9 z" fill="#7b7972"/>
    </marker>
    <marker id="arrow-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="arrowhead" d="M0 1 L9 5 L0 9 z" fill="#b6b4aa"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1000" height="493" fill="#faf9f6"/>
  <text class="t-cap ink3" x="20" y="26" fill="#7b7972">LEVEL 1 — SYSTEM CONTEXT</text>
  <g><rect class="b-person" x="45" y="46" width="208" height="72" rx="7" fill="#2c4a63" stroke="#22394c" stroke-width="1.25"/><text class="t-title ink on-dark" x="149" y="70" text-anchor="middle" fill="#ffffff">Anonymous visitor</text><text class="t-desc ink2 on-dark" x="149" y="92" text-anchor="middle" fill="#e6edf6">Browses public hackathons; no</text><text class="t-desc ink2 on-dark" x="149" y="105" text-anchor="middle" fill="#e6edf6">account.</text></g><g><rect class="b-person" x="279" y="46" width="208" height="72" rx="7" fill="#2c4a63" stroke="#22394c" stroke-width="1.25"/><text class="t-title ink on-dark" x="383" y="70" text-anchor="middle" fill="#ffffff">Participant</text><text class="t-desc ink2 on-dark" x="383" y="92" text-anchor="middle" fill="#e6edf6">Registers, proposes projects,</text><text class="t-desc ink2 on-dark" x="383" y="105" text-anchor="middle" fill="#e6edf6">joins a team, submits, votes.</text></g><g><rect class="b-person" x="513" y="46" width="208" height="85" rx="7" fill="#2c4a63" stroke="#22394c" stroke-width="1.25"/><text class="t-title ink on-dark" x="617" y="70" text-anchor="middle" fill="#ffffff">Organizer</text><text class="t-desc ink2 on-dark" x="617" y="92" text-anchor="middle" fill="#e6edf6">Owner of a hackathon: publishes,</text><text class="t-desc ink2 on-dark" x="617" y="105" text-anchor="middle" fill="#e6edf6">approves participants, forms</text><text class="t-desc ink2 on-dark" x="617" y="118" text-anchor="middle" fill="#e6edf6">teams, finalizes prizes.</text></g><g><rect class="b-person" x="747" y="46" width="208" height="72" rx="7" fill="#2c4a63" stroke="#22394c" stroke-width="1.25"/><text class="t-title ink on-dark" x="851" y="70" text-anchor="middle" fill="#ffffff">Platform admin</text><text class="t-desc ink2 on-dark" x="851" y="92" text-anchor="middle" fill="#e6edf6">Global casbin admin; passes every</text><text class="t-desc ink2 on-dark" x="851" y="105" text-anchor="middle" fill="#e6edf6">check via the g2 escape hatch.</text></g><g><rect class="b-sys" x="335" y="197" width="330" height="86" rx="7" fill="#1c5aa0" stroke="#154a86" stroke-width="1.25"/><text class="t-title ink on-dark" x="500" y="221" text-anchor="middle" fill="#ffffff">Hackagon</text><text class="t-tech ink3 on-dark" x="500" y="240" text-anchor="middle" fill="#dbe7f4">SvelteKit · Go/gRPC · Postgres</text><text class="t-desc ink2 on-dark" x="500" y="257" text-anchor="middle" fill="#e6edf6">Organizers run hackathons; participants register,</text><text class="t-desc ink2 on-dark" x="500" y="270" text-anchor="middle" fill="#e6edf6">propose, team up, submit and vote.</text></g><g><rect class="b-ext" x="45" y="349" width="208" height="86" rx="7" fill="#e8e7e1" stroke="#b6b4aa" stroke-width="1.25"/><text class="t-title ink" x="149" y="373" text-anchor="middle" fill="#17171a">Keycloak</text><text class="t-tech ink3" x="149" y="392" text-anchor="middle" fill="#7b7972">OIDC</text><text class="t-desc ink2" x="149" y="409" text-anchor="middle" fill="#4c4b48">Identity provider (realm</text><text class="t-desc ink2" x="149" y="422" text-anchor="middle" fill="#4c4b48">hackagon).</text></g><g><rect class="b-planned" x="279" y="349" width="208" height="116" rx="7" fill="#f2f1ec" stroke="#b6b4aa" stroke-width="1.25" stroke-dasharray="5 4"/><text class="t-title ink" x="383" y="373" text-anchor="middle" fill="#17171a">Notification queue</text><text class="t-title ink" x="383" y="390" text-anchor="middle" fill="#17171a">(planned)</text><text class="t-tech ink3" x="383" y="409" text-anchor="middle" fill="#7b7972">not built</text><text class="t-desc ink2" x="383" y="426" text-anchor="middle" fill="#4c4b48">Emails: confirmations, reminders,</text><text class="t-desc ink2" x="383" y="439" text-anchor="middle" fill="#4c4b48">team assignment, results (roadmap:</text><text class="t-desc ink2" x="383" y="452" text-anchor="middle" fill="#4c4b48">Core).</text></g><g><rect class="b-planned" x="513" y="349" width="208" height="86" rx="7" fill="#f2f1ec" stroke="#b6b4aa" stroke-width="1.25" stroke-dasharray="5 4"/><text class="t-title ink" x="617" y="373" text-anchor="middle" fill="#17171a">Object storage (planned)</text><text class="t-tech ink3" x="617" y="392" text-anchor="middle" fill="#7b7972">not built</text><text class="t-desc ink2" x="617" y="409" text-anchor="middle" fill="#4c4b48">Media uploads; links-only until it</text><text class="t-desc ink2" x="617" y="422" text-anchor="middle" fill="#4c4b48">exists.</text></g><g><rect class="b-planned" x="747" y="349" width="208" height="116" rx="7" fill="#f2f1ec" stroke="#b6b4aa" stroke-width="1.25" stroke-dasharray="5 4"/><text class="t-title ink" x="851" y="373" text-anchor="middle" fill="#17171a">Cache / policy watcher</text><text class="t-title ink" x="851" y="390" text-anchor="middle" fill="#17171a">(planned)</text><text class="t-tech ink3" x="851" y="409" text-anchor="middle" fill="#7b7972">not built</text><text class="t-desc ink2" x="851" y="426" text-anchor="middle" fill="#4c4b48">Needed before the backend can run</text><text class="t-desc ink2" x="851" y="439" text-anchor="middle" fill="#4c4b48">more than one replica (infra gap</text><text class="t-desc ink2" x="851" y="452" text-anchor="middle" fill="#4c4b48">I1).</text></g><path class="rel-line" d="M149 118 C149 157.5, 500 157.5, 500 190" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="288.9" y="150.5" width="71.19999999999999" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="324.5" y="160.5" text-anchor="middle" fill="#7b7972">uses · HTTPS</text><path class="rel-line" d="M383 118 C383 157.5, 500 157.5, 500 190" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="405.9" y="150.5" width="71.19999999999999" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="441.5" y="160.5" text-anchor="middle" fill="#7b7972">uses · HTTPS</text><path class="rel-line" d="M617 131 C617 164, 500 164, 500 190" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="522.9" y="157" width="71.19999999999999" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="558.5" y="167" text-anchor="middle" fill="#7b7972">uses · HTTPS</text><path class="rel-line" d="M851 118 C851 157.5, 500 157.5, 500 190" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="639.9" y="150.5" width="71.19999999999999" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="675.5" y="160.5" text-anchor="middle" fill="#7b7972">uses · HTTPS</text><path class="rel-line" d="M500 283 C500 316, 149 316, 149 342" fill="none" stroke="#7b7972" stroke-width="1.4" stroke-linecap="round" marker-end="url(#arrow)"/><rect class="rel-chip" x="273.6" y="309" width="101.8" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="324.5" y="319" text-anchor="middle" fill="#7b7972">tokens · OIDC/JWKS</text><path class="rel-line" d="M500 283 C500 316, 383 316, 383 342" fill="none" stroke="#b6b4aa" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arrow-p)"/><rect class="rel-chip" x="418.65" y="309" width="45.699999999999996" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="441.5" y="319" text-anchor="middle" fill="#7b7972">planned</text><path class="rel-line" d="M500 283 C500 316, 617 316, 617 342" fill="none" stroke="#b6b4aa" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arrow-p)"/><rect class="rel-chip" x="535.65" y="309" width="45.699999999999996" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="558.5" y="319" text-anchor="middle" fill="#7b7972">planned</text><path class="rel-line" d="M500 283 C500 316, 851 316, 851 342" fill="none" stroke="#b6b4aa" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#arrow-p)"/><rect class="rel-chip" x="652.65" y="309" width="45.699999999999996" height="14" rx="4" fill="#faf9f6"/><text class="t-rel ink3" x="675.5" y="319" text-anchor="middle" fill="#7b7972">planned</text>
</svg>